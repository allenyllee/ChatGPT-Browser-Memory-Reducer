name: Publish userscript to Gist

on:
  push:
    branches: ["main"]
    paths:
      - "chatgpt-browser-memory-reducer.user.js"
      - ".github/workflows/publish-gist.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_FILE: ${{ secrets.GIST_FILE }}
        run: |
          set -euo pipefail
          test -n "$GIST_TOKEN" || { echo "Missing secret: GIST_TOKEN"; exit 1; }
          test -n "$GIST_ID" || { echo "Missing secret: GIST_ID"; exit 1; }
          test -n "$GIST_FILE" || { echo "Missing secret: GIST_FILE"; exit 1; }

      - name: Publish script content to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_FILE: ${{ secrets.GIST_FILE }}
          SCRIPT_PATH: chatgpt-browser-memory-reducer.user.js
        run: |
          set -euo pipefail

          jq -n \
            --arg filename "$GIST_FILE" \
            --rawfile content "$SCRIPT_PATH" \
            '{files: {($filename): {content: $content}}}' > payload.json

          curl -fsSL \
            -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d @payload.json > /dev/null

          echo "Published ${SCRIPT_PATH} to gist ${GIST_ID} as ${GIST_FILE}"
